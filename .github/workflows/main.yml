name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Скачивание файлов
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настройка Java (Необходимо для Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Установка Flet
        run: |
          pip install -r requirements.txt
          pip install flet

      - name: Сборка Android APK
        run: yes | flet build apk
      - name: Выдача готового файла
        uses: actions/upload-artifact@v4
        with:
          name: AgroVent-APK
          path: build/apk/**/*.apk
